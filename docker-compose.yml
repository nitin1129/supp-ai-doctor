services:
  mongo:
    image: mongo:7
    ports: ["27017:27017"]
    volumes: [mongodata:/data/db]

  api:
    build: .
    env_file: .env
    environment:
      SUPPAI_MONGO_URL: mongodb://mongo:27017
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    ports: ["8000:8000"]
    depends_on: [mongo]
    volumes: [storage:/app/storage]

  worker:
    build: .
    env_file: .env
    environment:
      SUPPAI_MONGO_URL: mongodb://mongo:27017
    command: python -m app.worker
    depends_on: [api]

volumes:
  mongodata:
  storage:
